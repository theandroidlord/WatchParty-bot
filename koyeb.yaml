# Reference configuration for a Koyeb Web Service.
#
# Koyeb's GitHub deployment settings are configured on the Service itself;
# this file is kept as a reference for the intended port, route, health
# check, and scaling values. Select the Docker builder in the Koyeb Service.
#
# Intended values:
#   builder: docker
#   dockerfile: Dockerfile
#   service type: web
#   port: 8000/http
#   route: / -> 8000
#   health check: /health on 8000
#   min/max scale: 1/1
