# Koyeb deployment configuration
# Koyeb Web Services provide PORT automatically; the bot health server
# listens on that value and defaults to 8000 for local/Docker use.

services:
  - name: watchparty-bot
    type: web
    instance_type: nano
    min_scale: 1
    max_scale: 1
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    health_checks:
      - port: 8000
        protocol: http
        path: /health
